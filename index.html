<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a1130 0%, transparent 60%),
      radial-gradient(900px 900px at 90% 110%, #160b24 0%, transparent 55%),
      #0b0812;
    color:#e7e0f2;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .lock{
    width:min(420px,100%);text-align:center;
    background:linear-gradient(180deg,#1d1530,#16101f);
    border:1px solid #2c2140;border-radius:18px;
    padding:34px 30px 30px;
    box-shadow:0 30px 80px -30px rgba(120,40,220,.6);
  }
  .glyph{font-size:34px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(193,91,255,.6))}
  .kicker{
    font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;color:#6a6082;margin-bottom:6px;
  }
  h1{
    font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:24px;margin:0 0 18px;
    background:linear-gradient(90deg,#f0e7ff,#c98bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p.hint{color:#9086a8;font-size:13.5px;line-height:1.5;margin:0 0 20px}
  form{display:flex;flex-direction:column;gap:12px}
  input{
    font:inherit;font-size:15px;text-align:center;letter-spacing:.02em;
    background:#0f0a1a;border:1px solid #2c2140;border-radius:12px;
    color:#e7e0f2;padding:13px 14px;outline:none;transition:.16s;
  }
  input:focus{border-color:#c15bff;box-shadow:0 0 0 3px rgba(193,91,255,.18)}
  button{
    font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;color:#fff;border:none;border-radius:14px;padding:13px 18px;
    background:linear-gradient(90deg,#7e3fd6,#c15bff);
    box-shadow:0 10px 30px -10px rgba(180,70,255,.7);transition:.16s;
  }
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.55;cursor:progress;transform:none}
  .err{color:#ff5a7a;font-size:13px;min-height:18px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
  .shake{animation:shake .4s}
  @keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  .foot{margin-top:16px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#6a6082;letter-spacing:.06em}
</style>

  <script>
  (function(){
    const P = JSON.parse(document.getElementById('payload').textContent);
    const f = document.getElementById('f'), pw = document.getElementById('pw'),
          err = document.getElementById('err'), go = document.getElementById('go'),
          lock = document.getElementById('lock');
    const b64ToU8 = (b)=>Uint8Array.from(atob(b), c=>c.charCodeAt(0));

    async function unlock(password){
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:b64ToU8(P.salt), iterations:P.iter, hash:'SHA-256' },
        baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
      );
      const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToU8(P.iv) }, key, b64ToU8(P.ct));
      return new TextDecoder().decode(buf);
    }

    f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
      try{
        const html = await unlock(pw.value);
        // Render the decrypted game as a fresh document.
        document.open(); document.write(html); document.close();
      }catch(_){
        go.disabled=false; go.textContent='Unlock';
        err.textContent='Wrong passphrase — try again.';
        lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
        pw.select();
      }
    });
  })();
  </script>
